name: CI

# Lightweight production safety net: every PR must prove the app still boots.
# No production secrets, no real MongoDB, no external API calls.

on:
  push:
    branches: [main, claude-production-cleanup]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      # No ESLint config is committed yet; keep lint non-blocking so it never
      # fails the "does it boot" gate. Remove continue-on-error once configured.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  # ── Backend (Express) ───────────────────────────────────────────────────────
  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node -c server.js

      # Smoke tests use Node's built-in runner: boots the app on an ephemeral
      # port and asserts /health. No MongoDB / JWT secret / external API needed.
      - name: Smoke tests
        run: npm test

  # ── FastAPI (Python) ────────────────────────────────────────────────────────
  fastapi:
    name: FastAPI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/fastapi_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke tests (import + /health)
        run: pytest
