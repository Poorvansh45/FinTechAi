services:
  # ── FastAPI backend (auth, portfolio, AI, market data, scanners) ──
  # Express (backend/) is dormant — auth was migrated into FastAPI
  # (backend/fastapi_app/api/auth.py). It is no longer deployed here.
  - type: web
    name: finai-edge-fastapi
    env: python
    plan: free
    region: ohio # Change based on your preference
    rootDir: backend/fastapi_app
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; uvicorn must bind to it (do NOT hardcode 8000)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9 # numpy 1.26 / pandas 2.2 require Python 3.11–3.12
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # OHLCV source. MUST be "mongo" here: backend/data/Stock_Data.csv is
      # gitignored and ~124 MB, so it does not exist on Render. Left at the
      # "csv" default the scanners would find an empty universe, and a scan
      # that evaluates zero symbols publishes zero results — wiping every live
      # scanner cache. Run scripts/migrate_ohlcv_to_mongo.py BEFORE first boot.
      - key: OHLCV_BACKEND
        value: mongo
      - key: FRONTEND_URL
        sync: false # Your Vercel origin — added to FastAPI's CORS allow-list
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        sync: false # 32+ random chars — FastAPI now both signs and verifies with this
      # -- Market data / AI providers (all optional — graceful fallback) --
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      # GROWW_API_KEY / GROWW_TOTP_SECRET intentionally omitted — Groww is a
      # paid subscription (India only); the app falls back to yfinance without
      # it. Add them yourself only if you already pay for Groww access.
